# Render Blueprint — one-click free deploy of Shorts Factory
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: shorts-factory
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npx drizzle-kit push --force && npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      # If using Neon, paste your Neon pooled URL here in the Render dashboard.
      # If left as-is, it connects to the built-in free Render database below.
      - key: DATABASE_URL
        fromDatabase:
          name: shorts-factory-db
          property: connectionString
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: YOUTUBE_API_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: YT_CLIENT_ID
        sync: false
      - key: YT_CLIENT_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_STATE_REPO
        value: lasttopper/shorts-factory
      - key: CRON_SECRET
        sync: false
      # Zero-touch media worker (users must still confirm source rights in-app)
      - key: AUTO_RENDER_ENABLED
        value: "true"
      - key: AUTO_RENDER_MAX_SOURCE_SEC
        value: "1800"
      - key: SHORTS_RENDER_SIZE
        value: "720:1280"
      - key: FFMPEG_PRESET
        value: veryfast
      - key: FFMPEG_CRF
        value: "24"
      - key: FFMPEG_THREADS
        value: "1"
      - key: MAX_SOURCE_SIZE
        value: 700M

databases:
  - name: shorts-factory-db
    plan: free
    databaseName: shorts_factory
    user: shorts_factory
    postgresMajorVersion: "16"
